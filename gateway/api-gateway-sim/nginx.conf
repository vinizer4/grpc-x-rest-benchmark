worker_processes auto;
events {
    worker_connections 1024;
}

http {
    limit_req_zone $binary_remote_addr zone=api_gw_limit:10m rate=1000r/s;

    upstream rest_backend {
        server sales-service-rest:8080;
        keepalive 32;
    }

    server {
        listen 8443 ssl;

        ssl_certificate     /certs/api-gateway-sim/cert.pem;
        ssl_certificate_key /certs/api-gateway-sim/key.pem;

        limit_req zone=api_gw_limit burst=200 nodelay;

        # Simulates API Gateway's request validation/auth (an API key check),
        # which a real ALB in front of gRPC (alb-grpc-sim) does not do.
        if ($http_x_api_key != "benchmark-poc-api-key") {
            return 401;
        }

        location / {
            proxy_pass https://rest_backend;
            proxy_ssl_trusted_certificate /certs/ca/ca-cert.pem;
            proxy_ssl_verify off;
            proxy_ssl_session_reuse on;
            proxy_set_header Host $host;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 120s;
        }
    }
}
