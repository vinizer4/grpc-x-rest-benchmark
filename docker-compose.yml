services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sales
      POSTGRES_USER: sales
      POSTGRES_PASSWORD: sales
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sales -d sales"]
      interval: 5s
      timeout: 5s
      retries: 10

  sales-service-rest:
    build:
      context: .
      dockerfile: sales-service-rest/Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: sales
      DB_USER: sales
      DB_PASSWORD: sales
      SERVER_PORT: 8080
      SSL_ENABLED: "true"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  sales-service-grpc:
    build:
      context: .
      dockerfile: sales-service-grpc/Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: sales
      DB_USER: sales
      DB_PASSWORD: sales
      SERVER_PORT: 8081
      GRPC_SERVER_PORT: 9090
      SSL_ENABLED: "true"
    ports:
      - "8081:8081"
      - "9090:9090"
    depends_on:
      postgres:
        condition: service_healthy

  # Run after sales-service-rest or sales-service-grpc has started at least once
  # (Flyway creates the vendas table on their startup; datagen only inserts into it).
  datagen:
    profiles: ["datagen"]
    build:
      context: .
      dockerfile: datagen/Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: sales
      DB_USER: sales
      DB_PASSWORD: sales
      TOTAL_REGISTROS: 8000000
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
