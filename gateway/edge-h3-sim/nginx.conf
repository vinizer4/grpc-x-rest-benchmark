worker_processes 1;
events {
    worker_connections 1024;
}

http {
    upstream msgpack_backend {
        server sales-service-msgpack:8083;
        keepalive 32;
    }

    # Simulates a CDN/edge layer terminating HTTP/3 (QUIC) for the client,
    # then proxying internally over plain HTTP/1.1 - the MessagePack
    # backend doesn't need to know anything about QUIC. The "quic" listener
    # handles HTTP/3 traffic (UDP); the "ssl" listener is a TCP/HTTP/2
    # fallback, advertised via the Alt-Svc header, matching how real HTTP/3
    # deployments bootstrap clients that don't support QUIC yet.
    server {
        listen 8443 quic;
        listen 8443 ssl;
        http2 on;

        ssl_certificate     /certs/edge-h3-sim/cert.pem;
        ssl_certificate_key /certs/edge-h3-sim/key.pem;
        ssl_protocols TLSv1.3;

        add_header Alt-Svc 'h3=":8443"; ma=86400';

        location / {
            proxy_pass https://msgpack_backend;
            proxy_ssl_trusted_certificate /certs/ca/ca-cert.pem;
            proxy_ssl_verify off;
            proxy_ssl_session_reuse on;
            proxy_set_header Host $host;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 120s;
        }
    }
}
