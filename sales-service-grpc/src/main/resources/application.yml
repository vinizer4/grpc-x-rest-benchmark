spring:
  application:
    name: sales-service-grpc
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sales}
    username: ${DB_USER:sales}
    password: ${DB_PASSWORD:sales}
  flyway:
    locations: classpath:db/migration
  grpc:
    server:
      port: ${GRPC_SERVER_PORT:9090}

server:
  port: ${SERVER_PORT:8081}
