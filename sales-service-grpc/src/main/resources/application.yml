spring:
  application:
    name: sales-service-grpc
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sales}
    username: ${DB_USER:sales}
    password: ${DB_PASSWORD:sales}
  flyway:
    locations: classpath:db/migration
  grpc:
    server:
      port: ${GRPC_SERVER_PORT:9090}
      max-inbound-message-size: 20MB
      ssl:
        enabled: ${SSL_ENABLED:false}
        bundle: sales-service-grpc
  ssl:
    bundle:
      pem:
        sales-service-grpc:
          keystore:
            certificate: ${SSL_CERT:file:/certs/sales-service-grpc/cert.pem}
            private-key: ${SSL_KEY:file:/certs/sales-service-grpc/key.pem}

server:
  port: ${SERVER_PORT:8081}
