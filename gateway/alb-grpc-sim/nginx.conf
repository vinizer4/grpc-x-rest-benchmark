worker_processes auto;
events {
    worker_connections 1024;
}

http {
    upstream grpc_backend {
        server sales-service-grpc:9090;
        keepalive 32;
    }

    # No auth/rate-limit/request-mapping here on purpose: a real AWS ALB with a
    # gRPC target group is a plain L7 TLS-terminating load balancer, unlike
    # API Gateway (api-gateway-sim) which does request validation/auth/throttling.
    # AWS API Gateway does not support gRPC pass-through, so gRPC traffic in
    # production goes through an ALB (or a service mesh), not API Gateway.
    server {
        listen 8443 ssl http2;

        ssl_certificate     /certs/alb-grpc-sim/cert.pem;
        ssl_certificate_key /certs/alb-grpc-sim/key.pem;

        location / {
            grpc_pass grpcs://grpc_backend;
            grpc_ssl_trusted_certificate /certs/ca/ca-cert.pem;
            grpc_ssl_verify off;
            grpc_read_timeout 120s;
        }
    }
}
