worker_processes auto;
events {
    worker_connections 1024;
}

http {
    # api-gateway-sim's 1000r/s (with burst 200) is calibrated for
    # HTTP/1.1's one-request-per-connection-slot behavior. Over HTTP/2,
    # a handful of VUs multiplex enough concurrent streams to blow past
    # that ceiling almost immediately (503s from this limiter, not from
    # the backend), which would otherwise be measuring nginx's rate
    # limiter instead of the HTTP/1.1-vs-HTTP/2 transport difference this
    # gateway exists to isolate. Raised well above what the benchmark's
    # concurrency can produce so the backend (JVM/memory) stays the
    # actual ceiling.
    limit_req_zone $binary_remote_addr zone=api_gw_limit:10m rate=100000r/s;

    upstream rest_backend {
        server sales-service-rest-h2:8082;
        keepalive 32;
    }

    # Same behavior as gateway/api-gateway-sim, except the client-facing
    # listener negotiates HTTP/2 (via ALPN) instead of HTTP/1.1 - this is
    # the only variable being isolated in this comparison.
    server {
        listen 8443 ssl;
        http2 on;

        ssl_certificate     /certs/api-gateway-sim-h2/cert.pem;
        ssl_certificate_key /certs/api-gateway-sim-h2/key.pem;

        limit_req zone=api_gw_limit burst=5000 nodelay;

        if ($http_x_api_key != "benchmark-poc-api-key") {
            return 401;
        }

        location / {
            proxy_pass https://rest_backend;
            proxy_ssl_trusted_certificate /certs/ca/ca-cert.pem;
            proxy_ssl_verify off;
            proxy_ssl_session_reuse on;
            proxy_set_header Host $host;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 120s;
        }
    }
}
